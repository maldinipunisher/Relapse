<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Payload Manager</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:sans-serif; background:#0a0a0f; color:#e0e0e0; padding:20px; }
h1 { font-size:1.4rem; margin-bottom:4px; }
.sub { color:#888; font-size:.9rem; margin-bottom:20px; }
h2 { font-size:1rem; color:#6c5ce7; margin:16px 0 8px; text-transform:uppercase; letter-spacing:1px; }
.card { background:#12121a; border:1px solid #1e1e2e; border-radius:8px; padding:14px 16px; margin-bottom:8px; }
.row { display:table; width:100%; }
.left { display:table-cell; vertical-align:middle; }
.right { display:table-cell; vertical-align:middle; text-align:right; width:80px; }
.pname { font-weight:bold; font-size:1rem; }
.tag { display:inline-block; font-size:.75rem; padding:2px 8px; border-radius:10px; margin-top:4px; }
.tag-m { background:rgba(0,184,148,.15); color:#00b894; }
.tag-o { background:rgba(108,92,231,.15); color:#6c5ce7; }
.cb { width:28px; height:28px; cursor:pointer; }
.lock { color:#555; font-size:.85rem; }
.btns { margin:16px 0; }
.btn { display:inline-block; padding:12px 24px; border:none; border-radius:6px; cursor:pointer; font-size:1rem; font-weight:bold; color:#fff; margin:4px 4px 4px 0; }
.btn-run { background:#00b894; }
.status { margin:12px 0; padding:10px; background:#12121a; border-radius:6px; font-size:.9rem; }
.note { margin-top:16px; padding:12px; background:#1a1a2e; border:1px solid #2e2e3e; border-radius:6px; font-size:.85rem; color:#888; }
</style>
</head>
<body>
<h1>Payload Manager</h1>
<p class="sub">Pilih payload. Toggle disimpan di browser (localStorage).</p>

<h2>Wajib (always on)</h2>
<div id="mb"></div>

<h2>Optional (pilih)</h2>
<div id="ob"></div>

<div id="st" class="status"></div>

<div class="btns">
 <button class="btn btn-run" onclick="run()">Run Exploit</button>
</div>

<div class="note">
  <strong>Static mode</strong> — panel ini jalan tanpa server. Toggle disimpan di localStorage browser PS5.
  Kalau mau tambah/hapus payload, edit <code>payloads.json</code> lalu push ke GitHub.
</div>

<script>
var cfg = null;

function getDisabled() {
  try {
    var raw = localStorage.getItem("disabled_payloads");
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return {};
}

function setDisabled(d) {
  try { localStorage.setItem("disabled_payloads", JSON.stringify(d)); } catch(e) {}
}

function load() {
  var x = new XMLHttpRequest();
  x.open("GET", "payloads.json", true);
  x.onload = function() {
    if (x.status === 200) {
      cfg = JSON.parse(x.responseText);
      draw();
    }
  };
  x.send();
}

function draw() {
  if (!cfg) return;
  var disabled = getDisabled();

  var mh = "";
  for (var i = 0; i < cfg.mandatory.length; i++) {
    var p = cfg.mandatory[i];
    mh += '<div class="card"><div class="row">' +
      '<div class="left"><div class="pname">' + p + '</div>' +
      '<span class="tag tag-m">WAJIB</span></div>' +
      '<div class="right"><span class="lock">always</span></div>' +
      '</div></div>';
  }
  document.getElementById("mb").innerHTML = mh;

  var oh = "";
  for (var j = 0; j < cfg.optional.length; j++) {
    var q = cfg.optional[j];
    var ck = disabled[q] ? "" : " checked";
    oh += '<div class="card"><div class="row">' +
      '<div class="left"><div class="pname">' + q + '</div>' +
      '<span class="tag tag-o">OPTIONAL</span></div>' +
      '<div class="right"><input type="checkbox" class="cb"' + ck +
      ' onchange="tog(\'' + q + '\',this.checked)"></div>' +
      '</div></div>';
  }
  document.getElementById("ob").innerHTML = oh;

  var active = cfg.mandatory.length;
  for (var k = 0; k < cfg.optional.length; k++) {
    if (!disabled[cfg.optional[k]]) active++;
  }
  var total = cfg.mandatory.length + cfg.optional.length;
  document.getElementById("st").innerHTML = "Active: " + active + "/" + total + " payloads";
}

function tog(name, on) {
  var d = getDisabled();
  if (on) {
    delete d[name];
  } else {
    d[name] = true;
  }
  setDisabled(d);
  draw();
}

function run() {
  window.location.href = "index.html";
}

load();
</script>
</body>
</html>
