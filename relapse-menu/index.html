<style>

  body {
    background: #0a0a0c;
    color: #e8e8ec;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: -webkit-flex; display: flex;
    -webkit-flex-direction: column; flex-direction: column;
    -webkit-align-items: center; align-items: center;
    -webkit-justify-content: center; justify-content: center;

  .wrap {
    width: 100%; max-width: 400px;

  .actions {

  a.btn {
    display: -webkit-flex; display: flex;

    transition: border-color 0.2s, background 0.2s, box-shadow 0.2s, transform 0.1s;
    outline: none;
  }
  a.btn:hover, a.btn:focus, a.btn.ctl-focus {
    border-color: #7c6aef;
    background: #16151f;
    box-shadow: 0 0 0 1px #7c6aef, 0 4px 24px rgba(124, 106, 239, 0.25);
    -webkit-transform: translateY(-1px); transform: translateY(-1px);
  }
  a.btn:active { -webkit-transform: translateY(0); transform: translateY(0); }
  a.btn .ico { display: none; }
  .label-wrap {
    display: -webkit-flex; display: flex;
    -webkit-flex-direction: column; flex-direction: column;
    gap: 0.15em; min-width: 0;
  }
  .btn-label { font-size: 0.95em; }
  .btn-hint { font-size: 0.7em; color: #6b6b78; letter-spacing: 0.02em; text-transform: none; font-weight: 400; }
  a.btn .arrow {
    margin-left: auto; color: #6b6b78;
    -webkit-transition: color 0.2s, -webkit-transform 0.2s;
    transition: color 0.2s, transform 0.2s;
  }
  a.btn:hover .arrow, a.btn.ctl-focus .arrow { color: #7c6aef; -webkit-transform: translateX(2px); transform: translateX(2px); }
  a.btn.pulse {
    border-color: #34d399;
    box-shadow: 0 0 0 1px #34d399, 0 4px 24px rgba(52, 211, 153, 0.2);
    -webkit-animation: pulse-ok 2s ease-in-out infinite;
    animation: pulse-ok 2s ease-in-out infinite;
  }
  @-webkit-keyframes pulse-ok {
    0%, 100% { box-shadow: 0 0 0 1px #34d399, 0 4px 24px rgba(52, 211, 153, 0.2); }
    50% { box-shadow: 0 0 0 1px #34d399, 0 4px 32px rgba(52, 211, 153, 0.35); }
  }
  @keyframes pulse-ok {
    0%, 100% { box-shadow: 0 0 0 1px #34d399, 0 4px 24px rgba(52, 211, 153, 0.2); }
    50% { box-shadow: 0 0 0 1px #34d399, 0 4px 32px rgba(52, 211, 153, 0.35); }
  }
  #st {
    font-size: 0.75em; letter-spacing: 0.03em; color: #6b6b78;
    min-height: 1.2em; text-align: center; padding: 0 1em;
    -webkit-transition: color 0.2s; transition: color 0.2s;
  }
  #st.ok { color: #34d399; }
  #st.err { color: #f87171; -webkit-animation: shake 0.3s; animation: shake 0.3s; }
  @-webkit-keyframes shake {
    0%, 100% { -webkit-transform: translateX(0); }
    25% { -webkit-transform: translateX(-4px); }
    75% { -webkit-transform: translateX(4px); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }
  .nojs {
    text-align: center; padding: 2em 1.5em;
    color: #f87171; font-size: 1em; line-height: 1.6;
  }
  .nojs strong { display: block; font-size: 1.2em; margin-bottom: 0.5em; }
  .nojs .path { color: #e8e8ec; font-size: 0.85em; margin-top: 0.75em; }
  .selfhost-badge {
    display: inline-block; padding: 0.25em 0.75em;
    border: 1px solid #34d399; border-radius: 999px;
    color: #34d399; font-size: 0.65em; font-weight: 600;
    letter-spacing: 0.14em; text-transform: uppercase;
  }
  .credit {
    font-size: 0.62em; color: #46464f; letter-spacing: 0.02em;

  .credit a { color: #6b6b78; text-decoration: none; }

<body>
  <noscript>

  <div class="wrap">

        <span class="ico">

      </a>
      <a class="btn" id="pl" href="../payloads/">
        <span class="ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">

        <svg class="arrow" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4l4 4-4 4"/></svg>

      <div id="st"></div>

      <p class="credit">

        Chain: Relapse (AIO UAF + AF_ROUTE leak) · FW 7.00&ndash;13.60

<script>
  // Force http on PS5 — mixed content blocks the 127.0.0.1:9021 probe from https
  // Skip on github.io: Pages always 301s back to https -> infinite refresh loop on PS5.
  if (location.hostname.indexOf('github.io') === -1
      && /PlayStation 5\//.test(navigator.userAgent) && location.protocol === 'https:') {
    location.replace('http://' + location.host + location.pathname);
  }

  var st = document.getElementById('st');
  var jb = document.getElementById('jb');
  var pl = document.getElementById('pl');
  var tag = document.getElementById('tagline');
  var jailbroken = null;
  var isPS5 = /PlayStation 5\//.test(navigator.userAgent);
  // On https (github.io) the loader probe is blocked by mixed-content policy,
  // so we can't detect jailbreak state — never gate navigation there.
  var isPages = location.hostname.indexOf('github.io') !== -1;

  if (!isPS5) {
    st.textContent = 'preview mode — loader check skipped';
  } else if (isPages) {
    st.textContent = 'https host — loader check unavailable';
  }

  if (isPS5 && !isPages) fetch('http://127.0.0.1:9021/', {mode: 'no-cors', cache: 'no-store'})
    .then(function () {
      jailbroken = true;
      tag.textContent = 'Now play has no limits.';
      st.textContent = 'loader active — console jailbroken';
      st.className = 'ok';
      pl.classList.add('pulse');
    })
    .catch(function () {
      jailbroken = false;
      st.textContent = 'no loader detected — jailbreak first';
    });

  jb.addEventListener('click', function (ev) {
    if (isPS5 && !isPages && jailbroken === true) {
      ev.preventDefault();
      st.textContent = 'already jailbroken — pick a payload';
      st.className = 'ok';
      pl.classList.add('pulse');
    }
  });
  pl.addEventListener('click', function (ev) {
    if (isPS5 && !isPages && jailbroken === false) {
      ev.preventDefault();
      st.textContent = 'jailbreak first';
      st.className = '';
      void st.offsetWidth;
      st.className = 'err';
    }
  });

  // Controller / keyboard nav
  (function () {
    var idx = -1;
    function btns() { return Array.prototype.slice.call(document.querySelectorAll('a.btn')); }
    function show(i) {
      var bs = btns();
      if (!bs.length) return;
      if (i < 0) i = bs.length - 1;
      if (i >= bs.length) i = 0;
      idx = i;
      for (var n = 0; n < bs.length; n++) bs[n].classList.toggle('ctl-focus', n === idx);
      try { bs[idx].scrollIntoView({block: 'nearest'}); } catch (e) { bs[idx].scrollIntoView(false); }
    }
    function gridMove(dir) {
      var bs = btns();
      if (!bs.length) return;
      if (idx < 0) { show(0); return; }
      var r = bs[idx].getBoundingClientRect();
      var best = -1, bestScore = 1e9;
      for (var n = 0; n < bs.length; n++) {
        var q = bs[n].getBoundingClientRect();
        var dy = q.top - r.top;
        if (dir < 0 && dy > -4) continue;
        if (dir > 0 && dy < 4) continue;
        var score = Math.abs(q.left - r.left) + Math.abs(dy) * 0.1;
        if (score < bestScore) { bestScore = score; best = n; }
      }
      if (best >= 0) show(best); else show(idx + dir);
    }
    function activate() { var bs = btns(); if (idx >= 0 && bs[idx]) bs[idx].click(); }
    function back() { if (history.length > 1) history.back(); else location.href = "../"; }
    document.addEventListener('keydown', function (ev) {
      if (ev.key === 'ArrowDown') { gridMove(1); ev.preventDefault(); }
      else if (ev.key === 'ArrowUp') { gridMove(-1); ev.preventDefault(); }
      else if (ev.key === 'ArrowRight') { show(idx + 1); ev.preventDefault(); }
      else if (ev.key === 'ArrowLeft') { show(idx - 1); ev.preventDefault(); }
      else if (ev.key === 'Enter' && idx >= 0) { ev.preventDefault(); activate(); }
      else if (ev.key === 'Backspace' || ev.key === 'Escape' || ev.key === 'Esc') { ev.preventDefault(); back(); }
    });
    var last = {};
    setInterval(function () {
      if (!navigator.getGamepads) return;
      var gps = navigator.getGamepads();
      for (var g = 0; g < gps.length; g++) {
        var gp = gps[g]; if (!gp) continue;
        var now = Date.now();
        var pressed = function (i) { return gp.buttons[i] && gp.buttons[i].pressed; };
        function once(name, fn) { if (!last[name] || now - last[name] > 220) { last[name] = now; fn(); } }
        if (pressed(13)) once('d', function () { gridMove(1); });
        if (pressed(12)) once('u', function () { gridMove(-1); });
        if (pressed(15)) once('r', function () { show(idx + 1); });
        if (pressed(14)) once('l', function () { show(idx - 1); });
        if (pressed(0)) once('x', activate);
        if (pressed(1)) once('o', back);
      }
    }, 60);
  })();
</script>
