<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PS5 Jailbreak Redirect</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root { color-scheme: dark; }
html, body { margin: 0; padding: 0; background: #0b0d10; color: #d7dbe2;
    font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    min-height: 100vh; }
body { display: flex; align-items: center; justify-content: center; padding: 1rem; }
.card { max-width: 520px; width: 100%; text-align: center; }
.logo { display: block; width: 100%; max-width: 340px; height: auto;
    margin: 0 auto 2rem; }
input[type=text] { width: 100%; padding: 0.75rem; font-size: 1.05rem;
    box-sizing: border-box; border-radius: 6px; border: 1px solid #666;
    background: #111; color: #eee; }
input[type=text]:focus { border-color: #7ee787; outline: none; }
button { margin-top: 1rem; padding: 0.75rem 2rem; font-size: 1rem; font-weight: 600;
    border: none; border-radius: 6px; background: #7ee787; color: #0b0d10;
    cursor: pointer; }
button:focus { outline: 2px solid #fff; outline-offset: 2px; }
.recent { margin-top: 2rem; text-align: left; }
.fwline { margin: 0 0 1.25rem; font-size: 0.85rem; color: #8a8f98; }
.fwline .fwv { color: #7ee787; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
.exploits { margin-top: 2rem; text-align: left; }
.exploits h2 { font-size: 0.8rem; letter-spacing: 0.06em; text-transform: uppercase;
    color: #8a8f98; margin: 0 0 0.5rem; font-weight: 600; }
.exploits ul { list-style: none; padding: 0; margin: 0; }
.exploits a { display: flex; justify-content: space-between; align-items: baseline;
    gap: 0.75rem; padding: 0.6rem 0.75rem; color: #d7dbe2; text-decoration: none;
    border-radius: 5px; border: 1px solid transparent; }
.exploits a:hover, .exploits a:focus { background: #14181f; border-color: #30363d; outline: none; }
.exploits .name { font: 0.95rem/1.35 ui-monospace, SFMono-Regular, Consolas, monospace;
    color: #7ee787; }
.exploits .fw { font-size: 0.8rem; color: #8a8f98; white-space: nowrap; }
.recent h2 { font-size: 0.8rem; letter-spacing: 0.06em; text-transform: uppercase;
    color: #8a8f98; margin: 0 0 0.5rem; font-weight: 600; }
.recent ul { list-style: none; padding: 0; margin: 0; }
.recent li { display: flex; align-items: stretch; gap: 0.25rem; margin: 0; }
.recent a { display: block; padding: 0.55rem 0.75rem; color: #d7dbe2;
    text-decoration: none; border-radius: 5px;
    font: 0.92rem/1.35 ui-monospace, SFMono-Regular, Consolas, monospace;
    word-break: break-all; border: 1px solid transparent; }
.recent li > a:first-child { flex: 1 1 auto; min-width: 0; }
.recent a:hover, .recent a:focus { background: #14181f; border-color: #30363d; outline: none; }
.recent .x { flex: 0 0 auto; display: flex; align-items: center; padding: 0 0.7rem;
    color: #666; font: 1.05rem/1 sans-serif; }
.recent .x:hover, .recent .x:focus { color: #ff7b72; background: #21181a; outline: none; }
</style>
</head>
<body>
<div class="card">
<svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 130" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace" role="img" aria-label="etawen.dev">
  <text x="0" y="100" font-size="120" font-weight="600" letter-spacing="-1" fill="#e6edf3">etawen</text>
  <text x="464" y="100" font-size="60" font-weight="600" fill="#8aa0b8">.dev</text>
</svg>
<p class="fwline" id="fwline"></p>
<form onsubmit="go(); return false;">
<input type="text" id="url" placeholder="https://..." autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" autofocus />
<button type="submit">Go</button>
</form>
<div class="exploits">
<h2>Exploits</h2>
<ul>
<li><a href="/relapse-menu/"><span class="name">Relapse</span><span class="fw">7.00 &ndash; 13.60</span></a></li>
<li><a href="/pooP2JB/"><span class="name">pooP2JB</span><span class="fw">5.51 &ndash; 6.99</span></a></li>
<li><a href="/umtx2/"><span class="name">umtx2 / PS5 HEN</span><span class="fw">1.00 &ndash; 5.50</span></a></li>
<li><a href="https://soniciso1.github.io/poopicker"><span class="name">Sonic's Host</span><span class="fw">1.00 &ndash; 13.60 (github)</span></a></li>
</ul>
</div>
<div class="recent" id="recent" hidden>
<h2>Recent</h2>
<ul id="recent-list"></ul>
</div>
</div>
<script>
var KEY_LAST = "redirector_last_url";
var KEY_HIST = "redirector_history";
var MAX_HIST = 8;
var el = document.getElementById("url");
function loadHistory() {
    try {
        var raw = localStorage.getItem(KEY_HIST);
        if (raw) {
            var arr = JSON.parse(raw);
            if (Array.isArray(arr)) return arr.filter(function (x) { return typeof x === "string" && x; });
        }
    } catch (e) {}
    try {
        var last = localStorage.getItem(KEY_LAST);
        if (last && last !== "http://") return [last];
    } catch (e) {}
    return [];
}
function saveHistory(list) {
    try { localStorage.setItem(KEY_HIST, JSON.stringify(list)); } catch (e) {}
}
function renderRecent() {
    var hist = loadHistory();
    var box = document.getElementById("recent");
    var ul = document.getElementById("recent-list");
    ul.innerHTML = "";
    if (!hist.length) { box.hidden = true; return; }
    box.hidden = false;
    hist.forEach(function (u) {
        var li = document.createElement("li");
        var a = document.createElement("a");
        a.href = u;
        a.textContent = u;
        a.addEventListener("click", function (e) {
            e.preventDefault();
            navigate(u);
        });
        var x = document.createElement("a");
        x.className = "x";
        x.href = "#";
        x.textContent = "×";
        x.title = "Remove";
        x.addEventListener("click", function (e) {
            e.preventDefault();
            e.stopPropagation();
            var next = loadHistory().filter(function (v) { return v !== u; });
            saveHistory(next);
            renderRecent();
        });
        li.appendChild(a);
        li.appendChild(x);
        ul.appendChild(li);
    });
}
function pushHistory(u) {
    var hist = loadHistory().filter(function (v) { return v !== u; });
    hist.unshift(u);
    if (hist.length > MAX_HIST) hist.length = MAX_HIST;
    saveHistory(hist);
    try { localStorage.setItem(KEY_LAST, u); } catch (e) {}
}
function navigate(u) {
    pushHistory(u);
    window.location.href = u;
}
function go() {
    var u = el.value.trim();
    if (!u) return;
    if (!/^https?:\/\//i.test(u)) u = "http://" + u;
    navigate(u);
}
// show detected firmware
(function () {
    var m = navigator.userAgent.match(/PlayStation 5\/([\d.]+)/);
    var el = document.getElementById("fwline");
    if (m) {
        el.textContent = "";
        var t = document.createTextNode("your console reports firmware ");
        var b = document.createElement("span");
        b.className = "fwv";
        b.textContent = m[1];
        el.appendChild(t);
        el.appendChild(b);
    } else {
        el.textContent = "not a PS5 browser \u2014 firmware unknown";
    }
})();
// prefill input with most-recent, render list
var hist = loadHistory();
if (hist.length) el.value = hist[0];
renderRecent();
</script>
</body>
</html>
